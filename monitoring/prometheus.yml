# 5초 간격. Redis 연동(3초)과 맞출 필요는 없다 — Prometheus 는 이력/그래프용이다.
global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  # 슬레이브 컨테이너별 네트워크 / CPU / 메모리.
  # Docker API 를 직접 읽으므로 cgroup 접근 환경에 좌우되지 않는다.
  - job_name: metrics-agent
    static_configs:
      - targets: ['metrics-agent:9101']

  # 장비 CPU / 메모리 / NIC / 디스크
  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
